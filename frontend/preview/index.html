<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <title>Hapo — local interface preview</title>
    <style>
      :root {
        font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --primary-font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --mdc-typography-font-family: var(--primary-font-family);
        --primary-color: #03a9f4;
        --accent-color: #03a9f4;
        --primary-background-color: #fafafa;
        --secondary-background-color: #e5e5e5;
        --card-background-color: #ffffff;
        --ha-card-background: #ffffff;
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --disabled-text-color: #9b9b9b;
        --divider-color: rgba(0, 0, 0, .12);
        --app-header-background-color: #ffffff;
        --app-header-text-color: #212121;
        --sidebar-background-color: #ffffff;
        --sidebar-text-color: #212121;
        --sidebar-selected-background-color: #e1f5fe;
        --input-fill-color: #f5f5f5;
        --input-ink-color: var(--primary-text-color);
        --input-label-ink-color: var(--secondary-text-color);
        --state-active-color: #ffb300;
        --state-inactive-color: #9e9e9e;
        --success-color: #4caf50;
        --warning-color: #ff9800;
        --error-color: #db4437;
        --ha-card-border-radius: 12px;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --primary-color: #c5a4e0;
        --accent-color: #c5a4e0;
        --primary-background-color: #272a3a;
        --secondary-background-color: #303547;
        --card-background-color: #303547;
        --ha-card-background: #303547;
        --primary-text-color: #c4c9e9;
        --secondary-text-color: #a8aecb;
        --disabled-text-color: #777d99;
        --divider-color: rgba(171, 181, 215, .1);
        --app-header-background-color: #242735;
        --app-header-text-color: #c4c9e9;
        --sidebar-background-color: #303547;
        --sidebar-text-color: #c4c9e9;
        --sidebar-selected-background-color: #423c56;
        --input-fill-color: #272a3a;
        --state-active-color: #e5c479;
        --state-inactive-color: #777d99;
        --success-color: #9ac5a3;
        --warning-color: #e5c479;
        --error-color: #f28b82;
      }
      html, body { margin: 0; min-height: 100%; background: var(--primary-background-color); color: var(--primary-text-color); }
      body { height: 100vh; }
      hapo-panel { height: 100%; }
      .preview-error { margin: 24px; padding: 16px; border: 1px solid var(--error-color); }
    </style>
  </head>
  <body>
    <script type="module" src="/preview.js"></script>
  </body>
</html>
